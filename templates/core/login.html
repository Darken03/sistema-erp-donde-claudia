{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#6f53d9">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Iniciar Sesión - BizMaster</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <script>
    (function(){ try {
      var t = localStorage.getItem('bizm_theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch(e){ document.documentElement.setAttribute('data-theme','light'); } })();
    </script>
    <style>
        :root {
            --accent:#6f53d9; --accent-strong:#5b3fd4; --accent-soft:#ece9fb; --accent-tint:#f5f3fd;
            --bg:#f7f7fb; --surface:#ffffff; --soft:#f3f3f7; --line:#e6e6ec;
            --ink:#1f1f2c; --ink-2:#54546a; --ink-3:#8d8da0;
            --danger:#d64545; --danger-dark:#a83232; --danger-soft:#fdecec;
        }
        html[data-theme="dark"] {
            --bg:#14141c; --surface:#1e1e2a; --soft:#262633;
            --line:#2e2e3d; --ink:#f1f1f6; --ink-2:#b9b9c9; --ink-3:#85859a;
            --accent-tint:rgba(111,83,217,.22); --accent-soft:rgba(111,83,217,.32);
            color-scheme:dark;
        }
        * { box-sizing:border-box; }
        body {
            margin:0; min-height:100vh; min-height:100dvh;
            font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
            background:var(--bg); color:var(--ink);
            display:grid; place-items:center; padding:20px;
            position:relative; overflow:hidden;
            -webkit-font-smoothing:antialiased;
        }
        body::before, body::after {
            content:""; position:fixed; border-radius:50%; filter:blur(90px);
            pointer-events:none; z-index:0;
        }
        body::before { width:480px; height:480px; left:-140px; top:-140px;
            background:radial-gradient(circle,rgba(111,83,217,.35),transparent 70%); }
        body::after { width:520px; height:520px; right:-160px; bottom:-160px;
            background:radial-gradient(circle,rgba(182,92,214,.28),transparent 70%); }
        .login-card {
            position:relative; z-index:1;
            width:100%; max-width:400px;
            background:var(--surface); border:1px solid var(--line);
            border-radius:22px; overflow:hidden;
            box-shadow:0 24px 60px -20px rgba(31,31,44,.35);
        }
        .login-head { padding:32px 32px 8px; text-align:center; }
        .login-store-logo {
            height:104px; max-width:100%; object-fit:contain;
            border-radius:16px; margin-bottom:14px; background:#fff;
            box-shadow:0 4px 14px rgba(111,83,217,.25);
        }
        .login-head h1 { font-size:22px; font-weight:800; letter-spacing:-.02em; margin:0; }
        .login-head p { font-size:12.5px; color:var(--ink-3); margin:4px 0 0; }
        .login-body { padding:20px 32px 32px; }
        .login-body .form-label {
            font-size:11px; font-weight:700; letter-spacing:.05em;
            text-transform:uppercase; color:var(--ink-3); margin-bottom:6px;
        }
        .login-body .input-group-text {
            background:var(--soft); border:1px solid var(--line);
            color:var(--ink-3); font-size:15px;
        }
        .login-body .form-control {
            font-size:14px; border:1px solid var(--line); border-radius:8px;
            padding:10px 12px; min-height:44px; color:var(--ink); background:var(--surface);
        }
        .login-body .input-group .form-control { border-radius:0 8px 8px 0; }
        .login-body .input-group .form-control:not(:first-child):not(:last-child) {
            border-radius:0; border-left:0; border-right:0;
        }
        .login-body .input-group .input-group-text { border-radius:8px 0 0 8px; }
        .login-body .form-control:focus {
            border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-tint); outline:0;
        }
        .login-body .form-control::placeholder { color:var(--ink-3); }
        input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus {
            -webkit-box-shadow:0 0 0 1000px var(--accent-tint) inset !important;
            -webkit-text-fill-color:var(--ink) !important;
            transition:background-color 9999s ease-in-out 0s;
        }
        .btn-login {
            width:100%; height:48px; border:0; border-radius:12px;
            background:var(--accent); color:#fff;
            font-size:15px; font-weight:600;
            display:inline-flex; align-items:center; justify-content:center; gap:10px;
            box-shadow:0 4px 14px rgba(111,83,217,.32); cursor:pointer;
            transition:filter 120ms;
        }
        .btn-login:hover { filter:brightness(1.06); color:#fff; }
        .login-alert {
            display:flex; align-items:center; gap:10px;
            background:var(--danger-soft); color:var(--danger-dark);
            border:1px solid #f3c2c2; border-radius:10px;
            font-size:13px; font-weight:500; padding:10px 12px; margin-bottom:16px;
        }
        .login-foot {
            text-align:center; font-size:11.5px; color:var(--ink-3);
            padding:0 32px 24px;
        }
        .pw-toggle { cursor:pointer; min-width:48px; justify-content:center; display:inline-flex; align-items:center; }
        /* ---------- Responsive: S20 360px / tablet / notch ---------- */
        html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
        body {
            padding:
                calc(16px + env(safe-area-inset-top, 0px))
                calc(16px + env(safe-area-inset-right, 0px))
                calc(16px + env(safe-area-inset-bottom, 0px))
                calc(16px + env(safe-area-inset-left, 0px));
        }
        .login-store-logo { max-width:min(100%, 260px); height:auto; }
        .login-body .form-control { font-size:16px; } /* evita zoom en Samsung/Chrome */
        @media (max-width: 400px) {
            body { padding:12px; }
            .login-card { border-radius:18px; }
            .login-head { padding:24px 20px 6px; }
            .login-store-logo { height:84px; margin-bottom:10px; }
            .login-head h1 { font-size:19px; }
            .login-body { padding:16px 20px 24px; }
            .login-foot { padding:0 20px 20px; }
            .btn-login { height:52px; font-size:16px; }
        }
        @media (min-width: 768px) and (max-width: 1024px) {
            .login-card { max-width:440px; }
        }
        @media (max-height: 620px) {
            /* S20 landscape / pantallas bajas: compactar para que quepa sin scroll */
            .login-head { padding:18px 24px 4px; }
            .login-store-logo { height:64px; margin-bottom:8px; }
            .login-head h1 { font-size:18px; }
            .login-body { padding:12px 24px 20px; }
            .login-body .form-control { min-height:42px; }
            .btn-login { height:46px; }
            .login-foot { display:none; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { transition-duration:.01ms !important; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-head">
            {% if TIENDA.logo_url %}<img src="{{ TIENDA.logo_url }}" alt="{{ TIENDA.nombre }}" class="login-store-logo">
            {% else %}<img src="{% static 'img/logo-donde-clau.png' %}" alt="Donde Clau" class="login-store-logo">{% endif %}
            <h1>{{ TIENDA.nombre|default:"Donde Clau" }}</h1>
            <p>Bizz Master · Sistema de Gestión Empresarial</p>
        </div>
        <div class="login-body">
            {% if error %}
                <div class="login-alert">
                    <i class="bi bi-exclamation-circle"></i><span>{{ error }}</span>
                </div>
            {% endif %}
            <form method="post" autocomplete="on">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="id_username">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" id="id_username" class="form-control"
                               placeholder="Nombre de usuario" required autofocus autocomplete="username">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="id_password">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" name="password" id="id_password" class="form-control"
                               placeholder="Contraseña" required autocomplete="current-password">
                        <span class="input-group-text pw-toggle" id="pwToggle" title="Mostrar / ocultar" style="border-radius:0 8px 8px 0;">
                            <i class="bi bi-eye" id="pwToggleIcon"></i>
                        </span>
                    </div>
                </div>
                <button type="submit" class="btn-login">
                    <i class="bi bi-box-arrow-in-right"></i>Iniciar Sesión
                </button>
            </form>
        </div>
        <div class="login-foot">Acceso seguro · BizMaster ERP</div>
    </div>
    <script>
    document.getElementById('pwToggle').addEventListener('click', function(){
        var input = document.getElementById('id_password');
        var icon = document.getElementById('pwToggleIcon');
        if (input.type === 'password'){ input.type = 'text'; icon.classList.remove('bi-eye'); icon.classList.add('bi-eye-slash'); }
        else { input.type = 'password'; icon.classList.remove('bi-eye-slash'); icon.classList.add('bi-eye'); }
    });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
