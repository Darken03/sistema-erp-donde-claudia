{# Nodo del menú en cascada de categorías del POS (recursivo). #}
<div class="cat-node" data-familia="{{ nodo.familia }}">
  <button type="button" class="cat-item{% if nodo.hijas %} has-kids{% endif %}" data-categoria="{{ nodo.id }}">
    <span class="cicon">{% if nodo.icono|slice:":3" == "bi-" %}<i class="bi {{ nodo.icono }}"></i>{% elif nodo.icono %}{{ nodo.icono }}{% else %}{{ nodo.nombre|slice:":1"|upper }}{% endif %}</span><span class="cname">{{ nodo.nombre }}</span>{% if nodo.hijas %}<span class="cat-caret" data-caret title="Ver subcategorías"><i class="bi bi-chevron-right"></i></span>{% endif %}
  </button>
  {% if nodo.hijas %}<div class="cat-sub" role="menu">{% for h in nodo.hijas %}{% include "core/pos_cat_nodo.html" with nodo=h %}{% endfor %}</div>{% endif %}
</div>
