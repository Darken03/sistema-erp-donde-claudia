{% extends 'base.html' %}

{% block title %}{{ titulo }} - BizMaster{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-cash-coin me-2"></i>{{ titulo }}</h2>
    <a href="{% url 'core:gasto_lista' %}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i> Volver
    </a>
</div>

<div class="card border-0 shadow-sm" style="max-width: 600px;">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Efectivo ($)</label>
                <input type="number" name="cantidad_efectivo" class="form-control form-control-lg" step="0.01" min="0" value="{{ gasto.cantidad_efectivo|default:'0' }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Transferencia ($)</label>
                <input type="number" name="cantidad_transferencia" class="form-control form-control-lg" step="0.01" min="0" value="{{ gasto.cantidad_transferencia|default:'0' }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Categoria</label>
                <select name="categoria" class="form-select">
                    <option value="caja" {% if gasto.categoria == 'caja' %}selected{% endif %}>Salida de Caja</option>
                    <option value="servicio" {% if gasto.categoria == 'servicio' %}selected{% endif %}>Servicio</option>
                    <option value="sueldo" {% if gasto.categoria == 'sueldo' %}selected{% endif %}>Sueldo/Pago</option>
                    <option value="material" {% if gasto.categoria == 'material' %}selected{% endif %}>Materiales</option>
                    <option value="otro" {% if gasto.categoria == 'otro' %}selected{% endif %}>Otro</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Descripcion</label>
                <textarea name="descripcion" class="form-control" rows="3" placeholder="Descripcion del gasto...">{{ gasto.descripcion|default:'' }}</textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-warning">
                    <i class="bi bi-check-circle me-1"></i> Guardar
                </button>
                <a href="{% url 'core:gasto_lista' %}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
